name: TransitStop Pages Demo

on:
  push:
    branches:
    - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checking Out Code
      uses: actions/checkout@v7

    - name: Installing .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x

    # Runs TransitStop.Demo once to snapshot its message list, then writes the static page to _site
    - name: Build Static Demo
      run: bash pages/build.sh _site

    - name: Upload Pages Artifact
      uses: actions/upload-pages-artifact@v4
      with:
        path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
