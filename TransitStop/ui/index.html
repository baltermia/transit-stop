<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TransitStop · {{TITLE}}</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='3' width='26' height='20' rx='5' fill='%230f9d8a'/%3E%3Crect x='14.5' y='23' width='3' height='7' fill='%230f9d8a'/%3E%3Cpath d='M9 10h14M9 15h9' stroke='white' stroke-width='2.6' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root {
  --bg: #f6f7f9;
  --panel: #ffffff;
  --panel-2: #f1f3f6;
  --border: #e2e5ea;
  --text: #1b1f24;
  --muted: #646d78;
  --accent: #0f9d8a;
  --accent-strong: #0b7f70;
  --accent-soft: #e2f5f2;
  --on-accent: #ffffff;
  --danger: #c93a3a;
  --danger-soft: #fbe9e9;
  --ok: #1f8a4c;
  --warn: #a36a00;
  --focus: #0f9d8a55;
  --shadow: 0 1px 2px rgb(0 0 0 / .05), 0 4px 16px rgb(0 0 0 / .04);
  --mono: ui-monospace, "Cascadia Code", "JetBrains Mono", Consolas, monospace;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 14px/1.45 var(--sans);
  display: flex;
  flex-direction: column;
}
button, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

/* header */
header {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 16px;
  background: var(--panel);
  border-bottom: 1px solid var(--border);
  min-width: 0;
}
.brand { display: flex; align-items: center; gap: 8px; font-weight: 650; letter-spacing: -.01em; white-space: nowrap; }
.brand svg { width: 22px; height: 22px; flex: none; }
.app-title { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.header-spacer { flex: 1; }
.pill {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 2px 9px; border-radius: 999px;
  background: var(--panel-2); border: 1px solid var(--border);
  color: var(--muted); font-size: 12px; white-space: nowrap;
  max-width: 340px; overflow: hidden; text-overflow: ellipsis;
}
.pill .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); flex: none; }

/* layout */
.layout { flex: 1; display: grid; grid-template-columns: minmax(260px, 340px) 1fr; min-height: 0; }
aside {
  border-right: 1px solid var(--border);
  background: var(--panel);
  display: flex; flex-direction: column; min-height: 0;
}
.search { padding: 12px; border-bottom: 1px solid var(--border); }
.search-box { position: relative; }
.search-box input {
  width: 100%; padding: 8px 40px 8px 32px;
  border: 1px solid var(--border); border-radius: 8px; background: var(--panel-2);
}
.search-box input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--focus); background: var(--panel); }
.search-box svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); width: 15px; height: 15px; color: var(--muted); }
.search-box kbd { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); }
.list-meta { margin-top: 8px; font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; }
.list { overflow: auto; flex: 1; padding: 6px 0 12px; }
.group {
  padding: 12px 14px 4px; font-size: 11px; font-weight: 600; letter-spacing: .04em;
  text-transform: uppercase; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.item {
  display: block; width: 100%; text-align: left; border: 0; background: none; cursor: pointer;
  padding: 6px 14px 6px 12px; border-left: 2px solid transparent;
}
.item:hover { background: var(--panel-2); }
.item.active { background: var(--accent-soft); border-left-color: var(--accent); }
.item .name { display: flex; align-items: center; gap: 6px; font-weight: 550; overflow: hidden; }
.item .name span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .ns { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item mark { background: none; color: var(--accent-strong); font-weight: 700; }
.badge {
  font-size: 10.5px; font-weight: 600; padding: 0 6px; border-radius: 999px;
  background: var(--panel-2); color: var(--muted); border: 1px solid var(--border); flex: none;
}
.badge.edited { color: var(--warn); }
.empty-list { padding: 24px 16px; color: var(--muted); font-size: 13px; }

/* detail */
main { overflow: auto; min-width: 0; }
.detail { max-width: 980px; margin: 0 auto; padding: 20px 24px 40px; }
.title-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
h1 { font-size: 22px; margin: 0; letter-spacing: -.02em; overflow-wrap: anywhere; }
.full-name {
  font-family: var(--mono); font-size: 12.5px; color: var(--muted);
  margin-top: 4px; overflow-wrap: anywhere; cursor: copy;
}
.consumers { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; align-items: center; font-size: 12px; color: var(--muted); }
.chip {
  font-size: 12px; padding: 1px 8px; border-radius: 6px;
  background: var(--panel); border: 1px solid var(--border); color: var(--text); font-family: var(--mono);
}

.controls { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin: 18px 0 10px; }
.segmented { display: inline-flex; padding: 2px; border-radius: 9px; background: var(--panel-2); border: 1px solid var(--border); }
.segmented button {
  border: 0; background: none; padding: 5px 14px; border-radius: 7px; cursor: pointer; color: var(--muted); font-weight: 550;
}
.segmented button[aria-pressed="true"] { background: var(--panel); color: var(--text); box-shadow: var(--shadow); }
.destination { flex: 1; min-width: 220px; display: none; }
.destination.visible { display: block; }
.destination input, .headers textarea {
  width: 100%; padding: 7px 10px; border: 1px solid var(--border); border-radius: 8px;
  background: var(--panel); font-family: var(--mono); font-size: 13px;
}
.destination input:focus, .headers textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--focus); }

.editor-card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; box-shadow: var(--shadow); overflow: hidden; }
.editor-bar {
  display: flex; align-items: center; gap: 6px; padding: 6px 8px 6px 12px;
  border-bottom: 1px solid var(--border); background: var(--panel-2); font-size: 12px; color: var(--muted);
}
.editor-bar .label { font-weight: 600; margin-right: auto; }
.ghost {
  border: 1px solid transparent; background: none; padding: 3px 9px; border-radius: 6px; cursor: pointer; color: var(--muted); font-size: 12px;
}
.ghost:hover { background: var(--panel); border-color: var(--border); color: var(--text); }
#editor {
  display: block; width: 100%; min-height: 320px; resize: vertical;
  border: 0; padding: 12px 14px; background: var(--panel);
  font-family: var(--mono); font-size: 13px; line-height: 1.55; tab-size: 2; white-space: pre;
}
#editor:focus { outline: none; }
.editor-status { padding: 6px 12px; border-top: 1px solid var(--border); font-size: 12px; color: var(--muted); display: flex; gap: 8px; align-items: center; min-height: 31px; }
.editor-status.invalid { color: var(--danger); background: var(--danger-soft); }
.editor-status .ok { color: var(--ok); }

details.extra { margin-top: 12px; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; }
details.extra summary { cursor: pointer; padding: 9px 12px; font-size: 13px; font-weight: 550; color: var(--muted); list-style: none; display: flex; gap: 8px; align-items: center; }
details.extra summary::-webkit-details-marker { display: none; }
details.extra summary::before { content: "›"; display: inline-block; transition: transform .15s; font-size: 16px; line-height: 1; }
details.extra[open] summary::before { transform: rotate(90deg); }
details.extra .body { padding: 0 12px 12px; }
.headers textarea { min-height: 80px; resize: vertical; }
.hint { font-size: 12px; color: var(--muted); margin: 0 0 8px; }
.enum-row { display: flex; gap: 8px; flex-wrap: wrap; padding: 4px 0; font-size: 12.5px; align-items: baseline; }
.enum-row b { font-family: var(--mono); font-weight: 600; }
.enum-row code { font-family: var(--mono); color: var(--muted); }

.actions { display: flex; align-items: center; gap: 12px; margin-top: 16px; flex-wrap: wrap; }
.primary {
  border: 0; background: var(--accent); color: var(--on-accent); font-weight: 650;
  padding: 9px 20px; border-radius: 9px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px;
}
.primary:hover { background: var(--accent-strong); }
.primary:disabled { opacity: .55; cursor: not-allowed; }
.result { font-size: 13px; }
.result.ok { color: var(--ok); }
.result.error { color: var(--danger); overflow-wrap: anywhere; }
kbd {
  font-family: var(--mono); font-size: 11px; padding: 0 5px; border-radius: 4px;
  border: 1px solid var(--border); background: var(--panel); color: var(--muted);
}
.primary kbd { background: transparent; border-color: currentColor; color: inherit; opacity: .75; }

.recent { margin-top: 28px; }
.recent h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0 0 8px; display: flex; align-items: center; }
.recent h2 .ghost { margin-left: auto; text-transform: none; letter-spacing: 0; }
.recent-row {
  display: grid; grid-template-columns: 70px 64px 1fr auto; gap: 10px; align-items: center;
  padding: 7px 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--panel);
  margin-bottom: 6px; cursor: pointer; width: 100%; text-align: left; font-size: 13px;
}
.recent-row:hover { border-color: var(--accent); }
.recent-row .time { font-family: var(--mono); color: var(--muted); font-size: 12px; }
.recent-row .mode { font-size: 11px; font-weight: 600; text-transform: uppercase; color: var(--muted); }
.recent-row .what { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.recent-row .what small { color: var(--muted); font-family: var(--mono); margin-left: 6px; }
.recent-row .status.ok { color: var(--ok); }
.recent-row .status.error { color: var(--danger); }

.placeholder { display: grid; place-items: center; height: 100%; padding: 32px; text-align: center; color: var(--muted); }
.placeholder h2 { color: var(--text); font-size: 18px; margin: 12px 0 6px; }
.placeholder code { font-family: var(--mono); font-size: 12.5px; background: var(--panel-2); padding: 1px 5px; border-radius: 4px; }
.placeholder pre { text-align: left; font-family: var(--mono); font-size: 12.5px; background: var(--panel); border: 1px solid var(--border); padding: 12px 14px; border-radius: 8px; overflow: auto; }

.toast {
  position: fixed; bottom: 16px; right: 16px; max-width: min(440px, calc(100vw - 32px));
  padding: 10px 14px; border-radius: 10px; background: var(--text); color: var(--bg);
  font-size: 13px; box-shadow: 0 8px 30px rgb(0 0 0 / .2); opacity: 0; transform: translateY(8px);
  transition: opacity .15s, transform .15s; pointer-events: none;
}
.toast.show { opacity: 1; transform: none; }
</style>
</head>
<body>
<header>
  <div class="brand">
    <svg viewBox="0 0 32 32" aria-hidden="true"><rect x="3" y="3" width="26" height="20" rx="5" fill="var(--accent)"/><rect x="14.5" y="23" width="3" height="7" fill="var(--accent)"/><path d="M9 10h14M9 15h9" stroke="var(--panel)" stroke-width="2.6" stroke-linecap="round"/></svg>
    TransitStop
  </div>
  <div class="app-title" id="app-title">{{TITLE}}</div>
  <div class="header-spacer"></div>
  <span class="pill bus" id="bus-pill" hidden><span class="dot"></span><span id="bus-address"></span></span>
</header>

<div class="layout">
  <aside>
    <div class="search">
      <div class="search-box">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="search" type="search" placeholder="Search messages…" autocomplete="off" spellcheck="false" aria-label="Search messages">
        <kbd>/</kbd>
      </div>
      <div class="list-meta"><span id="count">Loading…</span><span>↑↓ Enter</span></div>
    </div>
    <div class="list" id="list" role="listbox" aria-label="Message types"></div>
  </aside>

  <main id="main">
    <div class="placeholder" id="placeholder">
      <div>
        <svg width="40" height="40" viewBox="0 0 32 32" aria-hidden="true"><rect x="3" y="3" width="26" height="20" rx="5" fill="var(--accent)" opacity=".85"/><rect x="14.5" y="23" width="3" height="7" fill="var(--accent)" opacity=".85"/></svg>
        <h2 id="placeholder-title">Loading message types…</h2>
        <div id="placeholder-body"></div>
      </div>
    </div>

    <div class="detail" id="detail" hidden>
      <div class="title-row">
        <h1 id="msg-name"></h1>
        <span class="badge" id="msg-kind"></span>
      </div>
      <div class="full-name" id="msg-id" title="Click to copy"></div>
      <div class="consumers" id="msg-consumers"></div>

      <div class="controls">
        <div class="segmented" role="group" aria-label="Dispatch mode">
          <button type="button" data-mode="publish" aria-pressed="true">Publish</button>
          <button type="button" data-mode="send" aria-pressed="false">Send</button>
        </div>
        <div class="destination" id="destination-wrap">
          <input id="destination" list="destinations" placeholder="queue name, queue:name or exchange:name" spellcheck="false" aria-label="Destination">
          <datalist id="destinations"></datalist>
        </div>
      </div>

      <div class="editor-card">
        <div class="editor-bar">
          <span class="label">Message JSON</span>
          <span class="badge edited" id="edited-badge" hidden>edited</span>
          <button class="ghost" id="format-btn" type="button" title="Format JSON (Alt+Shift+F)">Format</button>
          <button class="ghost" id="copy-btn" type="button">Copy</button>
          <button class="ghost" id="reset-btn" type="button" title="Replace with the generated sample">Reset to sample</button>
        </div>
        <textarea id="editor" spellcheck="false" autocomplete="off" aria-label="Message JSON"></textarea>
        <div class="editor-status" id="editor-status"></div>
      </div>

      <details class="extra" id="enums-section" hidden>
        <summary>Enum values</summary>
        <div class="body" id="enums"></div>
      </details>

      <details class="extra headers" id="headers-section">
        <summary>Headers <span class="badge" id="headers-count" hidden></span></summary>
        <div class="body">
          <p class="hint">Optional transport headers as a JSON object, e.g. <code>{"tenant": "acme"}</code>. Kept for all message types.</p>
          <textarea id="headers" spellcheck="false" placeholder="{}" aria-label="Headers JSON"></textarea>
        </div>
      </details>

      <div class="actions">
        <button class="primary" id="dispatch-btn" type="button">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7z"/></svg>
          <span id="dispatch-label">Publish</span>
          <kbd>Ctrl ↵</kbd>
        </button>
        <span class="result" id="result" role="status"></span>
      </div>

      <section class="recent" id="recent-section" hidden>
        <h2>Recent <button class="ghost" id="clear-recent" type="button">Clear</button></h2>
        <div id="recent"></div>
      </section>
    </div>
  </main>
</div>

<div class="toast" id="toast" role="status"></div>

<script>
(() => {
  "use strict";

  const $ = id => document.getElementById(id);
  const el = (tag, props = {}, ...children) => {
    const node = document.createElement(tag);
    for (const [k, v] of Object.entries(props)) {
      if (k === "class") node.className = v;
      else if (k === "text") node.textContent = v;
      else if (k.startsWith("on")) node.addEventListener(k.slice(2), v);
      else node.setAttribute(k, v);
    }
    for (const c of children) if (c != null) node.append(c);
    return node;
  };

  // ---- per-viewer storage (may be unavailable) ----
  let storePrefix = "transitstop:";
  const store = {
    get(key, fallback) {
      try { const v = localStorage.getItem(storePrefix + key); return v == null ? fallback : JSON.parse(v); }
      catch { return fallback; }
    },
    set(key, value) {
      try { localStorage.setItem(storePrefix + key, JSON.stringify(value)); } catch { /* ignore */ }
    },
    remove(key) {
      try { localStorage.removeItem(storePrefix + key); } catch { /* ignore */ }
    },
  };

  const state = {
    messages: [],
    byId: new Map(),
    filtered: [],
    selected: null,
    activeIndex: -1,
    mode: "publish",
    busy: false,
  };

  // ---- toast ----
  let toastTimer;
  const toast = text => {
    const t = $("toast");
    t.textContent = text;
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove("show"), 2200);
  };

  // ---- search ----
  const initials = name => (name.match(/[A-Z0-9]/g) || []).join("").toLowerCase();

  function score(m, tokens) {
    if (!tokens.length) return 1;
    const name = m.name.toLowerCase();
    const ns = m.namespace.toLowerCase();
    const caps = initials(m.name);
    let total = 0;
    for (const t of tokens) {
      if (name === t) total += 100;
      else if (name.startsWith(t)) total += 60;
      else if (caps.startsWith(t) && t.length > 1) total += 45;
      else if (name.includes(t)) total += 35;
      else if (ns.includes(t)) total += 10;
      else if (m.consumers.some(c => c.toLowerCase().includes(t))) total += 5;
      else return 0;
    }
    return total;
  }

  function highlight(text, tokens) {
    const frag = document.createDocumentFragment();
    if (!tokens.length) { frag.append(text); return frag; }
    const lower = text.toLowerCase();
    const marks = new Array(text.length).fill(false);
    for (const t of tokens) {
      let i = lower.indexOf(t);
      while (i >= 0) { for (let j = i; j < i + t.length; j++) marks[j] = true; i = lower.indexOf(t, i + t.length); }
    }
    let i = 0;
    while (i < text.length) {
      let j = i;
      while (j < text.length && marks[j] === marks[i]) j++;
      const part = text.slice(i, j);
      frag.append(marks[i] ? el("mark", { text: part }) : part);
      i = j;
    }
    return frag;
  }

  function renderList() {
    const query = $("search").value.trim().toLowerCase();
    const tokens = query.split(/\s+/).filter(Boolean);
    const list = $("list");
    list.replaceChildren();

    let items = state.messages.map(m => ({ m, s: score(m, tokens) })).filter(x => x.s > 0);
    if (tokens.length) items.sort((a, b) => b.s - a.s || a.m.name.localeCompare(b.m.name));
    state.filtered = items.map(x => x.m);

    $("count").textContent = tokens.length
      ? `${state.filtered.length} of ${state.messages.length} messages`
      : `${state.messages.length} messages`;

    if (!state.filtered.length) {
      list.append(el("div", { class: "empty-list", text: state.messages.length ? "No message matches your search." : "No message types found." }));
      return;
    }

    if (state.activeIndex >= state.filtered.length) state.activeIndex = state.filtered.length - 1;

    let lastNs = null;
    state.filtered.forEach((m, index) => {
      if (!tokens.length && m.namespace !== lastNs) {
        lastNs = m.namespace;
        list.append(el("div", { class: "group", text: m.namespace || "(global)", title: m.namespace }));
      }
      const edited = store.get("draft:" + m.id, null) != null;
      const item = el("button", {
          class: "item" + (state.selected === m ? " active" : "") + (index === state.activeIndex ? " active" : ""),
          type: "button", role: "option", "data-index": index,
          "aria-selected": String(state.selected === m),
          onclick: () => select(m),
        },
        el("div", { class: "name" },
          el("span", {}, highlight(m.name, tokens)),
          m.consumers.length ? el("span", { class: "badge", title: "Consumed by: " + m.consumers.join(", "), text: String(m.consumers.length) }) : null,
          edited ? el("span", { class: "badge edited", text: "edited" }) : null),
        tokens.length ? el("div", { class: "ns" }, highlight(m.namespace, tokens)) : null);
      list.append(item);
    });
  }

  function moveActive(delta) {
    if (!state.filtered.length) return;
    let i = state.activeIndex < 0 ? state.filtered.indexOf(state.selected) : state.activeIndex;
    i = Math.max(0, Math.min(state.filtered.length - 1, i + delta));
    state.activeIndex = i;
    renderList();
    $("list").querySelector(`[data-index="${i}"]`)?.scrollIntoView({ block: "nearest" });
  }

  // ---- editor ----
  const pretty = value => JSON.stringify(value, null, 2);

  function autosize() {
    const editor = $("editor");
    editor.style.height = "auto";
    editor.style.height = Math.min(Math.max(editor.scrollHeight + 2, 320), window.innerHeight * 0.7) + "px";
  }

  function validateEditor() {
    autosize();
    const status = $("editor-status");
    const text = $("editor").value;
    status.replaceChildren();
    try {
      JSON.parse(text);
      status.className = "editor-status";
      status.append(el("span", { class: "ok", text: "✓ Valid JSON" }));
      return true;
    } catch (e) {
      status.className = "editor-status invalid";
      status.append(e.message);
      return false;
    }
  }

  let draftTimer;
  function onEditorInput() {
    validateEditor();
    clearTimeout(draftTimer);
    draftTimer = setTimeout(saveDraft, 300);
  }

  function saveDraft() {
    const m = state.selected;
    if (!m) return;
    const text = $("editor").value;
    const isSample = text.trim() === pretty(m.sample).trim();
    if (isSample) store.remove("draft:" + m.id);
    else store.set("draft:" + m.id, text);
    $("edited-badge").hidden = isSample;
    renderList();
  }

  function select(m, { focusEditor = false, payload = null } = {}) {
    state.selected = m;
    state.activeIndex = -1;
    $("placeholder").hidden = true;
    $("detail").hidden = false;

    $("msg-name").textContent = m.name;
    $("msg-kind").textContent = m.kind;
    $("msg-id").textContent = m.id;

    const consumers = $("msg-consumers");
    consumers.replaceChildren();
    if (m.consumers.length) {
      consumers.append("Consumed here by");
      for (const c of m.consumers) consumers.append(el("span", { class: "chip", text: c }));
    }

    const draft = store.get("draft:" + m.id, null);
    $("editor").value = payload ?? draft ?? pretty(m.sample);
    $("edited-badge").hidden = draft == null && payload == null;
    if (payload != null) saveDraft();
    validateEditor();

    const enumKeys = Object.keys(m.enums || {});
    $("enums-section").hidden = !enumKeys.length;
    const enums = $("enums");
    enums.replaceChildren();
    for (const k of enumKeys) {
      enums.append(el("div", { class: "enum-row" }, el("b", { text: k }), el("code", { text: m.enums[k].join(" · ") })));
    }

    $("result").textContent = "";
    $("result").className = "result";
    store.set("selected", m.id);
    history.replaceState(null, "", "#" + encodeURIComponent(m.id));
    renderList();
    document.title = `${m.name} · TransitStop`;
    if (focusEditor) $("editor").focus();
  }

  // ---- mode ----
  function setMode(mode) {
    state.mode = mode;
    for (const b of document.querySelectorAll(".segmented button")) b.setAttribute("aria-pressed", String(b.dataset.mode === mode));
    $("destination-wrap").classList.toggle("visible", mode === "send");
    $("dispatch-label").textContent = mode === "send" ? "Send" : "Publish";
    store.set("mode", mode);
  }

  // ---- headers ----
  function readHeaders() {
    const text = $("headers").value.trim();
    if (!text) return {};
    const value = JSON.parse(text);
    if (value === null || typeof value !== "object" || Array.isArray(value)) throw new Error("Headers must be a JSON object.");
    return value;
  }

  function updateHeadersBadge() {
    const badge = $("headers-count");
    try {
      const n = Object.keys(readHeaders()).length;
      badge.hidden = n === 0;
      badge.textContent = String(n);
    } catch {
      badge.hidden = false;
      badge.textContent = "invalid";
    }
  }

  // ---- dispatch ----
  async function dispatch() {
    const m = state.selected;
    if (!m || state.busy) return;

    const result = $("result");
    let message, headers;
    try { message = JSON.parse($("editor").value); }
    catch (e) { result.className = "result error"; result.textContent = "Message JSON is invalid: " + e.message; return; }
    try { headers = readHeaders(); }
    catch (e) { result.className = "result error"; result.textContent = "Headers are invalid: " + e.message; $("headers-section").open = true; return; }

    const send = state.mode === "send";
    const destination = $("destination").value.trim();
    if (send && !destination) {
      result.className = "result error";
      result.textContent = "Enter a destination to send to.";
      $("destination").focus();
      return;
    }

    state.busy = true;
    $("dispatch-btn").disabled = true;
    result.className = "result";
    result.textContent = send ? "Sending…" : "Publishing…";

    const entry = { at: Date.now(), id: m.id, name: m.name, mode: state.mode, destination: send ? destination : null, payload: $("editor").value };
    try {
      const response = await fetch(send ? "api/send" : "api/publish", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ messageType: m.id, message, destination: send ? destination : undefined, headers }),
      });
      const body = await response.json().catch(() => ({ ok: false, error: `HTTP ${response.status}` }));
      if (!response.ok || !body.ok) throw new Error(body.error || `HTTP ${response.status}`);

      entry.ok = true;
      entry.elapsedMs = body.elapsedMs;
      result.className = "result ok";
      result.textContent = `✓ ${send ? "Sent to " + body.destination : "Published"} in ${body.elapsedMs} ms`;
      if (send) rememberDestination(destination);
    } catch (e) {
      entry.ok = false;
      entry.error = e.message;
      result.className = "result error";
      result.textContent = e.message;
    } finally {
      state.busy = false;
      $("dispatch-btn").disabled = false;
      addRecent(entry);
    }
  }

  // ---- recent ----
  function addRecent(entry) {
    const recent = store.get("recent", []);
    recent.unshift(entry);
    store.set("recent", recent.slice(0, 25));
    renderRecent();
  }

  function renderRecent() {
    const recent = store.get("recent", []);
    $("recent-section").hidden = !recent.length;
    const list = $("recent");
    list.replaceChildren();
    for (const r of recent) {
      const time = new Date(r.at).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" });
      list.append(el("button", {
          class: "recent-row", type: "button", title: r.error || "Load this payload into the editor",
          onclick: () => {
            const m = state.byId.get(r.id);
            if (!m) { toast("That message type is no longer listed."); return; }
            setMode(r.mode);
            if (r.destination) $("destination").value = r.destination;
            select(m, { payload: r.payload, focusEditor: true });
            toast("Loaded payload from " + time);
          },
        },
        el("span", { class: "time", text: time }),
        el("span", { class: "mode", text: r.mode }),
        el("span", { class: "what" }, r.name, r.destination ? el("small", { text: "→ " + r.destination }) : null),
        el("span", { class: "status " + (r.ok ? "ok" : "error"), text: r.ok ? `✓ ${r.elapsedMs} ms` : "✗ failed" })));
    }
  }

  function rememberDestination(destination) {
    const list = store.get("destinations", []).filter(d => d !== destination);
    list.unshift(destination);
    store.set("destinations", list.slice(0, 15));
    store.set("destination", destination);
    renderDestinations();
  }

  function renderDestinations() {
    const dl = $("destinations");
    dl.replaceChildren(...store.get("destinations", []).map(d => el("option", { value: d })));
  }

  // ---- wiring ----
  $("search").addEventListener("input", () => { state.activeIndex = 0; renderList(); });
  $("search").addEventListener("keydown", e => {
    if (e.key === "ArrowDown") { e.preventDefault(); moveActive(1); }
    else if (e.key === "ArrowUp") { e.preventDefault(); moveActive(-1); }
    else if (e.key === "Enter") {
      e.preventDefault();
      const m = state.filtered[state.activeIndex >= 0 ? state.activeIndex : 0];
      if (m) select(m, { focusEditor: true });
    } else if (e.key === "Escape") {
      $("search").value = "";
      renderList();
    }
  });

  $("editor").addEventListener("input", onEditorInput);
  $("editor").addEventListener("keydown", e => {
    if (e.key === "Tab" && !e.shiftKey) {
      e.preventDefault();
      document.execCommand("insertText", false, "  ");
    }
    if (e.altKey && e.shiftKey && (e.key === "F" || e.key === "f")) { e.preventDefault(); $("format-btn").click(); }
  });

  $("format-btn").addEventListener("click", () => {
    try { $("editor").value = pretty(JSON.parse($("editor").value)); onEditorInput(); }
    catch { toast("Fix the JSON first, then format."); }
  });
  $("copy-btn").addEventListener("click", async () => {
    try { await navigator.clipboard.writeText($("editor").value); toast("Copied message JSON"); }
    catch { toast("Copy is not available here."); }
  });
  $("reset-btn").addEventListener("click", () => {
    if (!state.selected) return;
    $("editor").value = pretty(state.selected.sample);
    store.remove("draft:" + state.selected.id);
    $("edited-badge").hidden = true;
    validateEditor();
    renderList();
  });
  $("msg-id").addEventListener("click", async () => {
    try { await navigator.clipboard.writeText(state.selected.id); toast("Copied type name"); } catch { /* ignore */ }
  });

  for (const b of document.querySelectorAll(".segmented button")) b.addEventListener("click", () => setMode(b.dataset.mode));
  $("destination").addEventListener("change", () => store.set("destination", $("destination").value.trim()));
  $("headers").addEventListener("input", () => { store.set("headers", $("headers").value); updateHeadersBadge(); });
  $("dispatch-btn").addEventListener("click", dispatch);
  $("clear-recent").addEventListener("click", () => { store.remove("recent"); renderRecent(); });

  document.addEventListener("keydown", e => {
    if ((e.ctrlKey || e.metaKey) && e.key === "Enter") { e.preventDefault(); dispatch(); return; }
    const typing = /^(INPUT|TEXTAREA)$/.test(document.activeElement?.tagName);
    if ((e.key === "/" && !typing) || ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k")) {
      e.preventDefault();
      $("search").focus();
      $("search").select();
    }
  });

  // ---- load ----
  function showPlaceholder(title, ...body) {
    $("detail").hidden = true;
    $("placeholder").hidden = false;
    $("placeholder-title").textContent = title;
    $("placeholder-body").replaceChildren(...body);
  }

  async function load() {
    let data;
    try {
      const response = await fetch("api/messages", { cache: "no-store" });
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      data = await response.json();
    } catch (e) {
      $("count").textContent = "Failed to load";
      showPlaceholder("Could not load message types", el("p", { text: e.message }));
      return;
    }

    storePrefix = "transitstop:" + (data.title || "") + ":";
    $("app-title").textContent = data.title || "";
    if (data.bus) { $("bus-address").textContent = data.bus; $("bus-pill").title = "Bus address: " + data.bus; $("bus-pill").hidden = false; }

    state.messages = data.messages;
    state.byId = new Map(data.messages.map(m => [m.id, m]));

    setMode(store.get("mode", "publish"));
    $("destination").value = store.get("destination", "");
    $("headers").value = store.get("headers", "");
    updateHeadersBadge();
    renderDestinations();
    renderRecent();
    renderList();

    if (!state.messages.length) {
      showPlaceholder("No message types found",
        el("p", { text: "TransitStop lists the messages consumed by this app's consumers and sagas, plus any you add explicitly:" }),
        el("pre", { text: "builder.Services.AddTransitStop(o =>\n    o.AddMessagesFromAssemblyContaining<MyMessage>());" }));
      return;
    }

    const fromHash = decodeURIComponent(location.hash.slice(1));
    const initial = state.byId.get(fromHash) || state.byId.get(store.get("selected", ""));
    if (initial) {
      select(initial);
      $("list").querySelector(".item.active")?.scrollIntoView({ block: "center" });
    } else {
      showPlaceholder("Pick a message",
        el("p", {}, "Search on the left, or press ", el("kbd", { text: "/" }), " to jump to the search box."));
    }
    $("search").focus();
  }

  load();
})();
</script>
</body>
</html>
